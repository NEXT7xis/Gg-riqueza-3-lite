          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.RandomAccessFile;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
            static MainActivity inst;
            static WebView web;
            static MutableContextWrapper wctx;
            static Context app;
            static ValueCallback<Uri[]> cb;
            static final Handler UI = new Handler(Looper.getMainLooper());

            static void js(final String c) {
              if (web == null) return;
              UI.post(() -> web.evaluateJavascript("window.gmCmd&&gmCmd('" + c.replace("'","\\\\'") + "')", null));
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              inst = this;
              app = getApplicationContext();
              int bg = Color.parseColor("#000000");
              getWindow().setStatusBarColor(bg);
              getWindow().setNavigationBarColor(bg);

              if (web == null) {
                wctx = new MutableContextWrapper(app);
                web = new WebView(wctx);
                web.setBackgroundColor(bg);
                WebSettings s = web.getSettings();
                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setMediaPlaybackRequiresUserGesture(false);
                s.setCacheMode(WebSettings.LOAD_DEFAULT);
                s.setRenderPriority(WebSettings.RenderPriority.HIGH);
                web.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null);
                web.addJavascriptInterface(new Bridge(), "Android");
                web.setWebChromeClient(new WebChromeClient() {
                  @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> c2, FileChooserParams p) {
                    MainActivity a = inst;
                    if (a == null) return false;
                    if (cb != null) cb.onReceiveValue(null);
                    cb = c2;
                    Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                    i.addCategory(Intent.CATEGORY_OPENABLE);
                    i.setType("audio/*");
                    i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                    try { a.startActivityForResult(i, 11); } catch (Exception e) { cb = null; return false; }
                    return true;
                  }
                });
                web.loadUrl("file:///android_asset/index.html");
              }

              wctx.setBaseContext(this);
              if (web.getParent() != null) ((ViewGroup) web.getParent()).removeView(web);
              setContentView(web);

              if (Build.VERSION.SDK_INT >= 33)
                requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
              else askBattery();
            }

            @Override public void onRequestPermissionsResult(int rq, String[] p, int[] r) {
              super.onRequestPermissionsResult(rq, p, r);
              askBattery();
            }

            void askBattery() {
              try {
                SharedPreferences sp = getSharedPreferences("gm", MODE_PRIVATE);
                if (sp.getBoolean("bat", false)) return;
                sp.edit().putBoolean("bat", true).apply();
                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                if (!pm.isIgnoringBatteryOptimizations(getPackageName()))
                  startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                    Uri.parse("package:" + getPackageName())));
              } catch (Exception e) {}
            }

            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              super.onActivityResult(rq, rs, d);
              if (rq == 11 && cb != null) {
                Uri[] r = null;
                if (rs == RESULT_OK && d != null) {
                  ClipData cd = d.getClipData();
                  if (cd != null) {
                    r = new Uri[cd.getItemCount()];
                    for (int i = 0; i < r.length; i++) r[i] = cd.getItemAt(i).getUri();
                  } else if (d.getData() != null) {
                    r = new Uri[]{d.getData()};
                  }
                }
                cb.onReceiveValue(r);
                cb = null;
              }
            }

            @Override public void onBackPressed() { moveTaskToBack(true); }

            @Override protected void onDestroy() {
              if (web != null && web.getParent() != null) ((ViewGroup) web.getParent()).removeView(web);
              if (wctx != null) wctx.setBaseContext(app);
              if (inst == this) inst = null;
              super.onDestroy();
            }

            static String esc(String s) {
              if (s == null) return "";
              return s.replace("\\\\","\\\\\\\\").replace("\\"","\\\\\\"").replace("\\n"," ").replace("\\r"," ");
            }
            static String safe(String s) { return s == null ? "" : s.replaceAll("[^A-Za-z0-9_]",""); }

            static class Bridge {
              @JavascriptInterface public void get(final String url, final String id) {
                new Thread(() -> {
                  String r;
                  try { r = download(url, safe(id)); }
                  catch (Exception e) { r = "{\\"ok\\":false,\\"err\\":\\"" + esc(e.getMessage()) + "\\"}"; }
                  final String res = r;
                  UI.post(() -> web.evaluateJavascript("gmDone('" + id + "'," + res + ")", null));
                }).start();
              }

              @JavascriptInterface public String chunk(String id, int off, int len) {
                try (RandomAccessFile f = new RandomAccessFile(new File(app.getCacheDir(), safe(id)), "r")) {
                  f.seek(off);
                  byte[] buf = new byte[len];
                  int n = f.read(buf);
                  if (n <= 0) return "";
                  return Base64.encodeToString(buf, 0, n, Base64.NO_WRAP);
                } catch (Exception e) { return ""; }
              }

              @JavascriptInterface public void del(String id) {
                new File(app.getCacheDir(), safe(id)).delete();
              }

              @JavascriptInterface public void media(String title, String artist,
                  boolean playing, int posMs, int durMs, boolean shuffle, boolean fav) {
                MusicService.title   = title   != null ? title   : "GG RQZ";
                MusicService.artist  = artist  != null ? artist  : "GG RQZ";
                MusicService.playing = playing;
                MusicService.pos     = posMs;
                MusicService.dur     = durMs;
                MusicService.shuffle = shuffle;
                MusicService.fav     = fav;
                UI.post(() -> MusicService.push(app));
              }

              @JavascriptInterface public void art(String b64) {
                try {
                  byte[] d = Base64.decode(b64, Base64.DEFAULT);
                  Bitmap bm = BitmapFactory.decodeByteArray(d, 0, d.length);
                  if (bm != null) MusicService.art = bm;
                } catch (Exception e) {}
              }
            }

            static String download(String u, String id) throws Exception {
              String cur = u;
              HttpURLConnection c = null;
              for (int i = 0; i < 10; i++) {
                c = (HttpURLConnection) new URL(cur).openConnection();
                c.setInstanceFollowRedirects(false);
                c.setConnectTimeout(20000);
                c.setReadTimeout(60000);
                c.setRequestProperty("User-Agent", "Mozilla/5.0 GGRqz/3.0");
                c.setRequestProperty("Accept", "*/*");
                int code = c.getResponseCode();
                if (code >= 300 && code < 400) {
                  String l = c.getHeaderField("Location");
                  c.disconnect();
                  if (l == null) throw new Exception("HTTP " + code);
                  cur = new URL(new URL(cur), l).toString();
                  continue;
                }
                if (code >= 400) throw new Exception("HTTP " + code);
                break;
              }
              String t = c.getContentType();
              if (t == null) t = "";
              if (t.startsWith("text/html")) throw new Exception("Link inválido — não é áudio");
              InputStream in = c.getInputStream();
              File out = new File(app.getCacheDir(), id);
              FileOutputStream fos = new FileOutputStream(out);
              byte[] buf = new byte[65536]; // 64KB chunks para velocidade
              int n; long size = 0;
              while ((n = in.read(buf)) != -1) { fos.write(buf, 0, n); size += n; }
              fos.close(); in.close();
              return "{\\"ok\\":true,\\"size\\":" + size + ",\\"type\\":\\"" + esc(t.split(";")[0].trim()) + "\\"}";
            }
          }
          EOF

          # ── MusicService.java ──────────────────────────────────────────────
          cat > app/src/main/java/com/gengar/music/MusicService.java <<'EOF'
          package com.gengar.music;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;

          public class MusicService extends Service {
            static MusicService inst;
            static String title = "GG RQZ", artist = "GG RQZ";
            static boolean playing, shuffle, fav;
            static long pos, dur;
            static Bitmap art;
            static final int ID = 7;
            static final String CH = "ggrqz_media";

            MediaSession session;
            NotificationManager nm;
            PowerManager.WakeLock wl;
            boolean fg;

            static void push(Context c) {
              if (inst == null) {
                Intent i = new Intent(c, MusicService.class);
                try {
                  if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i);
                  else c.startService(i);
                } catch (Exception e) {}
              } else inst.refresh();
            }

            @Override public void onCreate() {
              super.onCreate();
              inst = this;
              nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel(CH, "Reprodução", NotificationManager.IMPORTANCE_LOW);
                ch.setShowBadge(false);
                nm.createNotificationChannel(ch);
              }
              session = new MediaSession(this, "GGRqz");
              session.setCallback(new MediaSession.Callback() {
                @Override public void onPlay()            { MainActivity.js("play"); }
                @Override public void onPause()           { MainActivity.js("pause"); }
                @Override public void onStop()            { MainActivity.js("pause"); }
                @Override public void onSkipToNext()      { MainActivity.js("next"); }
                @Override public void onSkipToPrevious()  { MainActivity.js("prev"); }
                @Override public void onSeekTo(long p)    { MainActivity.js("seek:" + p); }
                @Override public void onCustomAction(String a, Bundle e) { MainActivity.js(a); }
              });
              session.setActive(true);
              PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
              wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ggrqz:music");
              wl.setReferenceCounted(false);
            }

            @Override public int onStartCommand(Intent i, int f, int s) {
              String a = i == null ? null : i.getAction();
              if (a != null && a.startsWith("gm.")) MainActivity.js(a.substring(3));
              else refresh();
              return START_NOT_STICKY;
            }

            @Override public IBinder onBind(Intent i) { return null; }
            @Override public void onTaskRemoved(Intent i) {}

            @Override public void onDestroy() {
              inst = null;
              if (wl != null && wl.isHeld()) wl.release();
              session.release();
              super.onDestroy();
            }

            void refresh() {
              updateSession();
              Notification n = build();
              try {
                if (Build.VERSION.SDK_INT >= 29)
                  startForeground(ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                else startForeground(ID, n);
                fg = true;
              } catch (Exception e) { nm.notify(ID, n); }
              if (playing) { if (!wl.isHeld()) wl.acquire(10L * 60 * 60 * 1000); }
              else if (wl.isHeld()) wl.release();
            }

            void updateSession() {
              MediaMetadata.Builder m = new MediaMetadata.Builder()
                .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                .putString(MediaMetadata.METADATA_KEY_ARTIST, artist)
                .putLong(MediaMetadata.METADATA_KEY_DURATION, dur);
              if (art != null) {
                m.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, art);
                m.putBitmap(MediaMetadata.METADATA_KEY_ART, art);
              }
              session.setMetadata(m.build());

              long acts = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE
                | PlaybackState.ACTION_PLAY_PAUSE | PlaybackState.ACTION_SKIP_TO_NEXT
                | PlaybackState.ACTION_SKIP_TO_PREVIOUS | PlaybackState.ACTION_SEEK_TO
                | PlaybackState.ACTION_STOP;

              session.setPlaybackState(new PlaybackState.Builder()
                .setActions(acts)
                .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED,
                  pos, playing ? 1f : 0f, SystemClock.elapsedRealtime())
                .addCustomAction(new PlaybackState.CustomAction.Builder(
                  "fav", "Curtir", fav ? R.drawable.ic_heart_on : R.drawable.ic_heart).build())
                .addCustomAction(new PlaybackState.CustomAction.Builder(
                  "shuf", "Aleatório", shuffle ? R.drawable.ic_shuffle_on : R.drawable.ic_shuffle).build())
                .build());
            }

            PendingIntent pi(String c) {
              Intent i = new Intent(this, MusicService.class).setAction("gm." + c);
              return PendingIntent.getService(this, c.hashCode(), i,
                PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
            }

            Notification build() {
              Notification.Builder b = Build.VERSION.SDK_INT >= 26
                ? new Notification.Builder(this, CH) : new Notification.Builder(this);
              Intent open = new Intent(this, MainActivity.class)
                .setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              b.setSmallIcon(R.drawable.ic_notif)
                .setContentTitle(title)
                .setContentText(artist)
                .setOngoing(true)
                .setShowWhen(false)
                .setVisibility(Notification.VISIBILITY_PUBLIC)
                .setContentIntent(PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE))
                .addAction(fav ? R.drawable.ic_heart_on : R.drawable.ic_heart, "Curtir", pi("fav"))
                .addAction(android.R.drawable.ic_media_previous, "Anterior", pi("prev"))
                .addAction(playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                  playing ? "Pausar" : "Tocar", pi(playing ? "pause" : "play"))
                .addAction(android.R.drawable.ic_media_next, "Próxima", pi("next"))
                .addAction(shuffle ? R.drawable.ic_shuffle_on : R.drawable.ic_shuffle, "Aleatório", pi("shuf"))
                .setStyle(new Notification.MediaStyle()
                  .setMediaSession(session.getSessionToken())
                  .setShowActionsInCompactView(1, 2, 3));
              if (art != null) b.setLargeIcon(art);
              return b.build();
            }
          }
          EOF

