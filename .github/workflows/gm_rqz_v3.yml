          }
          function startWave(){
            \$('wv').classList.add('playing');
            if(!waveTimer)waveTimer=setInterval(animWave,120);
          }
          function stopWave(){
            \$('wv').classList.remove('playing');
            clearInterval(waveTimer);waveTimer=null;
          }

          // media session bridge
          const ms=()=>{
            try{
              const s=S.songs.find(x=>x.id==Q[qi]);
              Android.media(
                s?(s.t||s.n):'GG RQZ',
                (s&&s.by)||'GG RQZ',
                !au.paused,
                Math.round((au.currentTime||0)*1000),
                Math.round((isFinite(au.duration)?au.duration:0)*1000),
                !!sh,
                !!(s&&S.fav.includes(s.id))
              );
            }catch(e){}
          };

          const FV=()=>S.fav.filter(i=>S.songs.some(x=>x.id==i));
          const tf=id=>{
            if(id==null)return;
            const i=S.fav.indexOf(id);
            i<0?S.fav.push(id):S.fav.splice(i,1);
            save();draw();ms();
          };
          const fav=()=>tf(Q[qi]);

          // cover art
          function sendArt(){
            try{
              const c=document.createElement('canvas');c.width=c.height=512;
              const g=c.getContext('2d');
              // black chrome gradient background
              const gr=g.createLinearGradient(0,0,512,512);
              gr.addColorStop(0,'#1a1a1a');gr.addColorStop(0.5,'#050505');gr.addColorStop(1,'#111');
              g.fillStyle=gr;g.fillRect(0,0,512,512);
              // chrome lines
              g.strokeStyle='rgba(180,180,180,0.2)';g.lineWidth=1;
              for(let i=0;i<512;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,512);g.stroke()}
              for(let i=0;i<512;i+=32){g.beginPath();g.moveTo(0,i);g.lineTo(512,i);g.stroke()}
              // text
              g.fillStyle='rgba(220,220,220,0.9)';
              g.font='bold 80px sans-serif';g.textAlign='center';
              g.fillText('GG',256,220);
              g.font='bold 56px sans-serif';g.fillStyle='rgba(140,140,140,0.8)';
              g.fillText('RQZ',256,300);
              Android.art(c.toDataURL('image/jpeg',.9).split(',')[1]);
            }catch(e){}
          }

          window.gmCmd=c=>{
            if(c=='play'){au.src?au.play():\$('pl').click()}
            else if(c=='pause')au.pause();
            else if(c=='next')step(1);
            else if(c=='prev')step(-1);
            else if(c=='fav')fav();
            else if(c=='shuf')\$('sh').click();
            else if(c.startsWith('seek:'))au.currentTime=+c.slice(5)/1000;
          };

          \$('f').onchange=e=>{
            const files=[...e.target.files];
            files.forEach(f=>{
              const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
              put(id,f);
              S.songs.push({id,n:f.name.replace(/\\.[^.]+\$/,'')});
            });
            save();draw();
            \$('a').textContent=files.length+' ARQUIVO'+(files.length>1?'S':'')+ ' ADICIONADO'+(files.length>1?'S':'');
            e.target.value='';
          };

          async function play(i,q){
            if(q)Q=q;
            qi=i;
            const id=Q[i],s=S.songs.find(x=>x.id==id);
            const b=await get(id);
            if(!s||!b){\$('a').textContent='ARQUIVO NÃO ENCONTRADO. ADICIONE DE NOVO.';return}
            const prev=au.src;
            if(prev&&prev.startsWith('blob:'))URL.revokeObjectURL(prev);
            au.src=URL.createObjectURL(b);
            au.play();
            S.hist=[id,...S.hist.filter(x=>x!=id)].slice(0,100);
            save();
            \$('t').textContent=(s.n||'').toUpperCase();
            \$('a').textContent=(s.by||'GG RQZ').toUpperCase();
            draw();
          }

          const step=d=>{
            if(!Q.length)return;
            play(sh?Math.floor(Math.random()*Q.length):(qi+d+Q.length)%Q.length);
          };

          \$('pl').onclick=()=>au.src?(au.paused?au.play():au.pause()):S.songs.length&&play(0,S.songs.map(x=>x.id));
          \$('nx').onclick=()=>step(1);
          \$('pv').onclick=()=>step(-1);
          \$('fv').onclick=fav;
          \$('fpa').onclick=()=>{const v=FV();if(v.length)play(0,v)};
          \$('sh').onclick=e=>{sh=!sh;e.currentTarget.classList.toggle('on',sh);ms()};
          \$('rp').onclick=e=>{rp=!rp;e.currentTarget.classList.toggle('on',rp)};

          au.onplay=()=>{\$('pl').textContent='⏸';startWave();ms()};
          au.onpause=()=>{\$('pl').textContent='▶';stopWave();ms()};
          au.onplaying=au.onloadedmetadata=au.onseeked=ms;
          au.onended=()=>{if(qi<Q.length-1||sh||rp)step(1)};
          au.ontimeupdate=()=>{
            \$('c').textContent=fm(au.currentTime);
            \$('d').textContent=fm(au.duration);
            \$('p').value=au.duration?au.currentTime/au.duration*1000:0;
          };
          \$('p').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};

          // nav tabs
          document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
            document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));
            ['s','l','dw','hs','fa'].forEach(v=>\$(v).hidden=b.dataset.v!=v);
          });

          \$('pc').onclick=()=>{
            const n=\$('pn').value.trim().toUpperCase();
            if(n){S.lists.push({n,ids:[]});\$('pn').value='';save();draw()}
          };

          document.onclick=e=>{
            const t=e.target;
            if(t.dataset.p!=null)play(+t.dataset.p,S.songs.map(x=>x.id));
            if(t.dataset.fs!=null)tf(S.songs[+t.dataset.fs].id);
            if(t.dataset.fp!=null)play(+t.dataset.fp,FV());
            if(t.dataset.fr!=null)tf(FV()[+t.dataset.fr]);
            if(t.dataset.r!=null){const x=RES[+t.dataset.r];x.save?dl(x.u,x.n,x.by):playUrl(x.u,x.n)}
            if(t.dataset.pi!=null){const[j,i]=t.dataset.pi.split(',');play(+i,[...S.lists[+j].ids])}
            if(t.dataset.rm!=null){const[j,i]=t.dataset.rm.split(',');S.lists[+j].ids.splice(+i,1);save();draw()}
            if(t.dataset.hp!=null)play(+t.dataset.hp,S.hist.filter(i=>S.songs.some(x=>x.id==i)));
            if(t.dataset.x!=null){
              if(t.textContent=='APAGAR'){t.textContent='TEM CERTEZA?';setTimeout(draw,3000)}
              else{S.lists.splice(+t.dataset.x,1);save();draw()}
            }
            if(t.dataset.ds!=null){
              if(t.textContent=='✕'){t.textContent='OK?';setTimeout(draw,3000)}
              else delSong(S.songs[+t.dataset.ds].id)
            }
            if(t.dataset.l!=null){const l=S.lists[+t.dataset.l];if(l.ids.length)play(0,[...l.ids])}
          };

          document.onchange=e=>{
            const t=e.target;
            if(t.dataset.a&&t.value!==''){
              const l=S.lists[+t.value];
              if(!l.ids.includes(t.dataset.a))l.ids.push(t.dataset.a);
              save();draw();t.value='';
            }
          };

          function draw(){
            const cur=Q[qi];
            const nm=id=>(S.songs.find(x=>x.id==id)||{n:'?'}).n.toUpperCase();
            const lk=S.fav.includes(cur);
            \$('fv').textContent=lk?'♥':'♡';
            \$('fv').classList.toggle('on',lk);

            \$('sl').innerHTML=S.songs.length
              ?S.songs.map((s,i)=>\`<li class="\${s.id==cur?'now':''}">
                <button class="nm" data-p="\${i}">\${esc(s.n.toUpperCase())}</button>
                <button class="hb\${S.fav.includes(s.id)?' on':''}" data-fs="\${i}">♥</button>
                <select data-a="\${s.id}">
                  <option value="">＋</option>
                  \${S.lists.map((l,j)=>\`<option value="\${j}">\${esc(l.n)}</option>\`).join('')}
                </select>
                <button class="rm" data-ds="\${i}">✕</button>
              </li>\`).join('')
              :'<li class="empty">// NENHUMA MÚSICA. TOQUE EM + ADICIONAR.</li>';

            \$('ll').innerHTML=S.lists.length
              ?S.lists.map((l,j)=>\`<li>
                <b class="nm">\${esc(l.n)}</b>
                <button class="go" data-l="\${j}">▶</button>
                <button class="rm" data-x="\${j}">APAGAR</button>
                <div style="width:100%;padding-top:6px">
                  \${l.ids.length
                    ?l.ids.map((id,i)=>\`<div class="tk">
                      <button class="nm" data-pi="\${j},\${i}">\${esc(nm(id))}</button>
                      <button class="rm" data-rm="\${j},\${i}">✕</button>
                    </div>\`).join('')
                    :'<span class="empty">// VAZIA</span>'}
                </div>
              </li>\`).join('')
              :'<li class="empty">// CRIE SUA PRIMEIRA PLAYLIST.</li>';

            const FI=FV();
            \$('fl2').innerHTML=FI.length
              ?FI.map((id,i)=>\`<li class="\${id==cur?'now':''}">
                <button class="nm" data-fp="\${i}">♥ \${esc(nm(id))}</button>
                <button class="rm" data-fr="\${i}">✕</button>
              </li>\`).join('')
              :'<li class="empty">// NENHUMA FAVORITA.</li>';

            const H=S.hist.filter(i=>S.songs.some(x=>x.id==i));
            \$('hl').innerHTML=H.length
              ?H.map((id,i)=>\`<li>
                <button class="nm" data-hp="\${i}">\${esc(nm(id))}</button>
              </li>\`).join('')
              :'<li class="empty">// HISTÓRICO VAZIO.</li>';
          }

          function delSong(id){
            if(Q[qi]==id){au.pause();stopWave()}
            S.songs=S.songs.filter(x=>x.id!=id);
            S.fav=S.fav.filter(x=>x!=id);
            S.lists.forEach(l=>l.ids=l.ids.filter(x=>x!=id));
            S.hist=S.hist.filter(x=>x!=id);
            delete BB[id];
            try{db.transaction('b','readwrite').objectStore('b').delete(id)}catch(e){}
            save();draw();
          }

          // download system
          let RES=[],jid=0;
          const pend={};
          const st=t=>{\$('dst').textContent='// '+t.toUpperCase()};

          try{\$('djk').value=localStorage.jk||''}catch(e){}

          function playUrl(u,n){
            Q=[];qi=-1;
            au.src=u;au.play();
            \$('t').textContent=n.toUpperCase();
            \$('a').textContent='STREAMING ONLINE';
            draw();
          }

          function dl(u,n,by){
            const id='d'+(++jid)+Date.now().toString(36);
            pend[id]={n,by};
            st('Baixando: '+n);
            Android.get(u,id);
          }

          window.gmDone=function(id,r){
            const p=pend[id];if(!p)return;
            const n=p.n;delete pend[id];
            if(!r.ok){st('Erro: '+r.err);return}
            st('Salvando...');
            let off=0;const P=[];const L=524288; // 512KB chunks
            (function nx(){
              const s=Android.chunk(id,off,L);
              if(s){
                const b=atob(s),u=new Uint8Array(b.length);
                for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
                P.push(u);off+=b.length;
                if(off<r.size)return setTimeout(nx,0);
              }
              Android.del(id);
              if(!off){st('Erro ao salvar');return}
              const sid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
              const type=/^audio/.test(r.type)?r.type:'audio/mpeg';
              put(sid,new Blob(P,{type}));
              S.songs.push({id:sid,n:p.by?n+' - '+p.by:n,t:n,by:p.by||''});
              save();draw();st('Pronto: '+n+' — aba Músicas');
            })();
          };

          \$('dgo').onclick=()=>{
            const u=\$('dlk').value.trim();
            if(!/^https?:\\/\\//i.test(u)){st('Cole um link que comece com http');return}
            let n='Música';
            try{n=decodeURIComponent(u.split('?')[0].split('/').pop()).replace(/\\.[^.]+\$/,'')||n}catch(e){}
            dl(u,n);
          };

          \$('dbs').onclick=async()=>{
            const q=\$('dq').value.trim(),j=\$('djk').value.trim();
            if(!q)return;
            try{localStorage.jk=j}catch(e){}
            st('Buscando...');\$('dres').innerHTML='';RES=[];
            try{
              let R=[];
              if(\$('dso').value=='a'){
                const r=await(await fetch('https://api.audius.co/v1/tracks/search?limit=20&app_name=GGRqz&query='+encodeURIComponent(q))).json();
                R=(r.data||[]).map(t=>({n:t.title,by:t.user&&t.user.name,u:'https://api.audius.co/v1/tracks/'+t.id+'/stream?app_name=GGRqz'}));
              }else{
                if(!j){st('Cole sua chave client_id do Jamendo');return}
                const r=await(await fetch('https://api.jamendo.com/v3.0/tracks/?format=json&limit=20&audiodlformat=mp32&client_id='+encodeURIComponent(j)+'&search='+encodeURIComponent(q))).json();
                R=(r.results||[]).filter(t=>t.audiodownload_allowed&&t.audiodownload).map(t=>({n:t.name,by:t.artist_name,u:t.audiodownload,save:1}));
              }
              RES=R;
              st(R.length?R.length+' resultados':'Nada encontrado');
              \$('dres').innerHTML=R.map((t,i)=>\`<li>
                <span class="nm">\${esc(t.n||'')} <small>\${esc(t.by||'')}</small></span>
                <button class="go" data-r="\${i}">\${t.save?'BAIXAR':'OUVIR'}</button>
              </li>\`).join('');
            }catch(e){st('Erro na busca. Verifique internet/chave.')}
          };

          \$('hc').onclick=()=>{S.hist=[];save();draw()};

          draw();
          setTimeout(sendArt,600);
          </script>
          </body></html>
          HTMLEOF

      - name: Compilar
        working-directory: gm
        run: gradle assembleDebug --no-daemon --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: GG-RQZ-V3
          path: gm/app/build/outputs/apk/debug/app-debug.apk
`;
document.getElementById('code').textContent = txt;
function copy(){
  navigator.clipboard.writeText(txt).then(()=>{
    const o=document.getElementById('ok');
    o.textContent='✓ copiado!';
    setTimeout(()=>o.textContent='',2000);
  });
}
</script>
</body></html>
