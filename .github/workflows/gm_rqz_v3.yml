          try{S=JSON.parse(localStorage.gm)}catch(e){}
          S.hist=S.hist||[];S.fav=S.fav||[];
          const save=()=>{try{localStorage.gm=JSON.stringify(S)}catch(e){}};
          const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
          const fm=s=>isFinite(s)&&s>=0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';

          // IndexedDB blob storage
          try{
            const o=indexedDB.open('ggrqz',1);
            o.onupgradeneeded=()=>o.result.createObjectStore('b');
            o.onsuccess=()=>{db=o.result};
          }catch(e){}

          const BB={};
          const put=(id,b)=>{BB[id]=b;try{const t=db.transaction('b','readwrite');t.objectStore('b').put(b,id)}catch(e){}};
          const get=id=>BB[id]?Promise.resolve(BB[id]):new Promise(r=>{
            try{const q=db.transaction('b').objectStore('b').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}
            catch(e){r()}
          });

          // waveform animation
